<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Jobs - LINKED OUT</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo">LINKED OUT</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="jobs.html" class="active">Browse Jobs</a></li>
                <li><a href="admin.html">Admin</a></li>
            </ul>
        </div>
    </nav>

    <section class="jobs-section">
        <div class="container">
            <h1>All Jobs</h1>
            
            <div class="filter-section">
                <label for="categoryFilter">Filter by Category:</label>
                <select id="categoryFilter">
                    <option value="">All Categories</option>
                    <option value="Technology">Technology</option>
                    <option value="Finance">Finance</option>
                    <option value="Healthcare">Healthcare</option>
                    <option value="Education">Education</option>
                    <option value="Retail">Retail</option>
                </select>
            </div>

            <div id="jobsList" class="jobs-grid">
                <!-- Jobs will be inserted here by JavaScript -->
            </div>

            <div id="noJobs" class="no-jobs" style="display:none;">
                <p>No jobs found matching your criteria.</p>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2024 LINKED OUT. All rights reserved.</p>
    </footer>

    <script src="data.js"></script>
    <script src="jobs.js"></script>
</body>
</html>
