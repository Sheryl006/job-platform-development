<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - LINKED OUT</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="container">
            <h1>LINKED OUT</h1>
        </div>
    </header>

    <!-- Navigation -->
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="jobs.html">Jobs</a></li>
            <li><a href="admin.html" class="active">Admin</a></li>
        </ul>
    </nav>

    <!-- Main Content -->
    <main>
        <div class="container">
            <!-- Login Section -->
            <div id="loginSection" class="auth-section">
                <h2>Admin Login</h2>
                <div class="auth-form">
                    <input type="text" id="adminUsername" placeholder="Username" value="admin">
                    <input type="password" id="adminPassword" placeholder="Password" value="admin123">
                    <button onclick="adminLogin()" class="btn btn-primary">Login</button>
                </div>
                <p style="margin-top: 10px; color: #666; font-size: 14px;">Demo: username=<strong>admin</strong>, password=<strong>admin123</strong></p>
            </div>

            <!-- Dashboard Section (Hidden by default) -->
            <div id="dashboardSection" style="display: none;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h2>Admin Dashboard</h2>
                    <button onclick="adminLogout()" class="btn btn-secondary">Logout</button>
                </div>

                <!-- Add Job Form -->
                <div class="form-section">
                    <h3>Add New Job</h3>
                    <div class="form-group">
                        <input type="text" id="jobTitle" placeholder="Job Title" required>
                        <input type="text" id="jobCompany" placeholder="Company Name" required>
                        <select id="jobCategory" required>
                            <option value="">Select Category</option>
                            <option value="Technology">Technology</option>
                            <option value="Finance">Finance</option>
                            <option value="Education">Education</option>
                            <option value="Healthcare">Healthcare</option>
                            <option value="Hospitality">Hospitality</option>
                        </select>
                        <input type="text" id="jobLocation" placeholder="Location" required>
                        <input type="text" id="jobSalary" placeholder="Salary Range" required>
                        <textarea id="jobDescription" placeholder="Job Description" rows="6" required></textarea>
                        <button onclick="addJob()" class="btn btn-primary">Add Job</button>
                    </div>
                </div>

                <!-- Jobs List -->
                <div class="jobs-section">
                    <h3>Manage Jobs</h3>
                    <div id="adminJobsList" class="jobs-container">
                        <!-- Jobs will be loaded here -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2024 LINKED OUT. All rights reserved. A Kenyan Job Advertisement Platform.</p>
    </footer>

    <script src="data.js"></script>
    <script src="admin.js"></script>
</body>
</html>
